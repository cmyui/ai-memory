[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recall"
version = "0.1.0"
description = "Semantic memory for Claude Code"
requires-python = ">=3.13"
dependencies = [
    "databases[aiosqlite]>=0.9,<1",
    "numpy>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "einops>=0.8,<1",
    "openai>=1.0,<3",
    "pymupdf>=1.25,<2",
    "sentence-transformers>=3.0,<4",
]

[project.scripts]
recall = "recall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["recall"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
]
