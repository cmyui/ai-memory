{% extends "base.html" %}
{% block content %}

<h2 style="font-size: 16px; margin-bottom: 12px;">Memory #{{ memory.id }}</h2>

<div class="detail-source">
    Source: {{ memory.source_file or "remembered" }}
    {% if memory.section_path %} &mdash; {{ memory.section_path }}{% endif %}
</div>

<form method="post" action="/memory/{{ memory.id }}/update">
    <textarea name="content">{{ memory.content }}</textarea>
    <div class="actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/" class="btn btn-secondary">Cancel</a>
    </div>
</form>

<form method="post" action="/memory/{{ memory.id }}/delete" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #21262d;">
    <button type="submit" class="btn btn-danger" onclick="return confirm('Delete this memory?')">Delete</button>
</form>

{% endblock %}
