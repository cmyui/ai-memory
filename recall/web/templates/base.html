<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recall — {{ title if title else "memory" }}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; line-height: 1.6; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .container { max-width: 960px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid #21262d; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #f0f6fc; }
        .header nav a { margin-left: 16px; color: #8b949e; font-size: 14px; }
        .header nav a:hover { color: #f0f6fc; }

        .search-bar { width: 100%; padding: 10px 14px; font-size: 14px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; margin-bottom: 16px; }
        .search-bar:focus { outline: none; border-color: #58a6ff; }

        .memory-card { background: #161b22; border: 1px solid #21262d; border-radius: 6px; padding: 12px 16px; margin-bottom: 8px; }
        .memory-card:hover { border-color: #30363d; }
        .memory-content { font-size: 13px; white-space: pre-wrap; word-break: break-word; }
        .memory-meta { font-size: 11px; color: #484f58; margin-top: 6px; display: flex; justify-content: space-between; }
        .memory-meta .source { color: #8b949e; }
        .memory-meta .score { color: #3fb950; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin: 20px 0; }
        .pagination a, .pagination span { padding: 6px 12px; border-radius: 6px; font-size: 13px; }
        .pagination a { background: #21262d; color: #c9d1d9; }
        .pagination a:hover { background: #30363d; text-decoration: none; }
        .pagination .current { background: #1f6feb; color: #fff; }

        .stats { text-align: center; font-size: 12px; color: #484f58; margin-bottom: 12px; }

        textarea { width: 100%; min-height: 200px; padding: 12px; font-size: 13px; font-family: 'SF Mono', Consolas, monospace; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; resize: vertical; }
        textarea:focus { outline: none; border-color: #58a6ff; }

        .btn { display: inline-block; padding: 8px 16px; font-size: 13px; border-radius: 6px; border: none; cursor: pointer; }
        .btn-primary { background: #238636; color: #fff; }
        .btn-primary:hover { background: #2ea043; }
        .btn-danger { background: #da3633; color: #fff; }
        .btn-danger:hover { background: #f85149; }
        .btn-secondary { background: #21262d; color: #c9d1d9; }
        .btn-secondary:hover { background: #30363d; }

        .actions { display: flex; gap: 8px; margin-top: 12px; }
        .detail-source { font-size: 12px; color: #8b949e; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><a href="/" style="color: #f0f6fc;">recall</a></h1>
            <nav>
                <a href="/">browse</a>
                <a href="/create">+ add</a>
            </nav>
        </div>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
