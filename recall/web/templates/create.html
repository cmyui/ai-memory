{% extends "base.html" %}
{% block content %}

<h2 style="font-size: 16px; margin-bottom: 12px;">Add memory</h2>

<form method="post" action="/create">
    <textarea name="content" placeholder="Enter a memory..."></textarea>
    <div class="actions">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="/" class="btn btn-secondary">Cancel</a>
    </div>
</form>

{% endblock %}
